[project]
name = "docling-local-api"
version = "0.1.0"
description = "Loopback-only Docling conversion API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.115.0",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psutil>=7.2,<8",
  "pypdfium2>=5.13,<6",
  "pymupdf4llm>=0.2.9,<1",
  "markitdown[docx,pptx,xlsx]>=0.1.4,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
